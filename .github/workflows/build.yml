name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev wget

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Setup Android SDK and build-tools
        run: |
          # Создаём структуру SDK, ожидаемую buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          # Скачиваем command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/
          # Копируем содержимое cmdline-tools в папку tools (не в cmdline-tools/latest)
          cp -r /tmp/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/tools/
          # Принимаем все лицензии
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses
          # Устанавливаем платформу и build-tools
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Build with buildozer
        run: |
          python -m buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk